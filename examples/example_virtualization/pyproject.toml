[tool.pylockware]

# Basic Settings
project_path = "."
entry_point = "main.py"
entry_function = "main"
output_dir = "dist"

# Obfuscation Options
remap = false
string_prot = true
num_obf = false
import_obf = false
state_machine = true
builtin_dispatcher = true
junk_code = true
decorator_obf = true
call_obf = false
disable_traceback = true
virtualization = true
# Obfuscation Parameters
junk_density = 0.5
opaque_complexity = "high"
name_gen = "english"
banner = "Obfuscated by PyLockWare"

# Anti-Debug (leave commented to disable)
# anti_debug = "native"  # or "crossplatform"
anti_debug_mode = "native"

# Nuitka Options (for compiling to executable)
enable_nuitka = false