[tool.pylockware]

# Basic Settings
project_path = "."
entry_point = "main.py"
entry_function = "main"
output_dir = "dist"

# Obfuscation Options
remap = false
string_prot = false
num_obf = false
import_obf = false
state_machine = false
builtin_dispatcher = false
junk_code = true
decorator_obf = false
call_obf = false
disable_traceback = false
crypt = false
anti_tamper_builtins = false
# Obfuscation Parameters
junk_density = 1.0
opaque_complexity = "high"
name_gen = "english"
banner = "Obfuscated by PyLockWare"

# Anti-Debug (leave commented to disable)
# anti_debug = "native"  # or "crossplatform"
anti_debug_mode = "crossplatform"

# Nuitka Options (for compiling to executable)
enable_nuitka = false