[tool.pylockware]

# Basic Settings
project_path = "."
entry_point = "main.py"
entry_function = "main"
output_dir = "dist"

# Obfuscation Options
remap = true
string_prot = true
num_obf = true
import_obf = false
state_machine = true
builtin_dispatcher = true
junk_code = true
decorator_obf = true
call_obf = true
disable_traceback = true
crypt = true
anti_tamper_builtins = false
# Obfuscation Parameters
junk_density = 1.0
opaque_complexity = "high"
name_gen = "chinese"
banner = "Obfuscated by PyLockWare"

# Anti-Debug (leave commented to disable)
# anti_debug = "native"  # or "crossplatform"
anti_debug_mode = "crossplatform"

# Nuitka Options (for compiling to executable)
enable_nuitka = false